<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>A FALSE HOPE | Reader</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
    <style>
        :root { --aura-color: #a855f7; --void-black: #020617; --gold: #fbbf24; --crimson: #991b1b; --blood-red: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--void-black); color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        #particle-canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; transition: opacity 0.5s; }
        
        .fantasy-font { font-family: 'Cinzel', serif; }
        .view { height: 100vh; width: 100vw; position: fixed; inset: 0; z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .hidden { display: none !important; }
        
        .glass-panel { background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .bold-italic { font-weight: 900; font-style: italic; letter-spacing: -0.04em; }
        
        /* Modal Backdrop */
        .modal-bg { background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(8px); }

        /* Title Gradient - Red Only */
        .animated-title {
            background: linear-gradient(to right, #7f1d1d, #ef4444, #f87171, #7f1d1d);
            background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: gradient-flow 4s linear infinite; display: inline-block; white-space: nowrap;
        }
        @keyframes gradient-flow { 0% { background-position: 0% center; } 100% { background-position: 100% center; } }
        
        /* Read Now Button - Blue Gradient */
        .btn-read-now {
            background: linear-gradient(270deg, #1e3a8a, #3b82f6, #1d4ed8);
            background-size: 300% 300%;
            animation: gradient-move 3s ease infinite;
        }

        /* Mystic Tablet Styling */
        .chapter-tablet {
            position: relative;
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: inset 0 0 20px rgba(168, 85, 247, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }
        .chapter-tablet::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.4), transparent);
        }
        .chapter-tablet:active { transform: scale(0.97); border-color: var(--gold); }
        
        .chapter-num-glow {
            font-size: 1.1rem; font-weight: 900; line-height: 1;
            background: linear-gradient(to bottom, #fff 0%, var(--gold) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.4));
            min-width: 2.5ch; text-align: center;
        }

        .action-orb {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%; width: 52px; height: 52px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .action-orb:active { background: rgba(168, 85, 247, 0.2); border-color: var(--aura-color); }
        
        .rotating-gear { animation: rotate 4s linear infinite; transform-origin: center; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .hero-wrapper { max-width: 800px; margin: 0 auto; position: relative; }
        .hero-image-container { position: relative; width: 100%; height: 35vh; overflow: hidden; border-bottom: 1px solid rgba(168, 85, 247, 0.1); }
        .hero-image { width: 100%; height: 100%; object-fit: cover; }
        .hero-black-fade { position: absolute; bottom: 0; left: 0; right: 0; height: 100%; background: linear-gradient(to top, var(--void-black) 0%, transparent 80%); }
        .genre-tag { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(4px); padding: 3px 8px; border-radius: 4px; font-size: 8px; font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.5); }
        
        .scroll-container::-webkit-scrollbar { width: 4px; }
        .scroll-container::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.3); border-radius: 10px; }
        
        .creator-glow { 
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); 
            border: 2px solid #a855f7 !important;
            animation: creator-pulse 2.5s infinite alternate;
        }
        @keyframes creator-pulse {
            from { box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); border-color: #a855f7; }
            to { box-shadow: 0 0 30px rgba(236, 72, 153, 0.8); border-color: #ec4899; }
        }
        
        .tab-btn { transition: 0.3s; color: rgba(255,255,255,0.3); }
        .tab-btn.active { border-bottom: 2px solid var(--aura-color); color: white; }

        .zoom-container { overflow: hidden; position: relative; }
        .manga-page { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: zoom-in; width: 100%; display: block; }
        .manga-page.zoomed { transform: scale(2.2); cursor: zoom-out; z-index: 50; position: relative; }

        #brightness-overlay { position: fixed; inset: 0; background: black; pointer-events: none; z-index: 2000; opacity: 0; transition: opacity 0.3s; }
        
        @keyframes gradient-move {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .toggle-switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #a855f7; }
        input:checked + .slider:before { transform: translateX(16px); }

        .expandable-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .expanded .expandable-content { max-height: 600px; }
        
        #reader-view { overflow-y: scroll !important; -webkit-overflow-scrolling: touch; }
        #reader-pages { padding-bottom: 50px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Author Tag Specific */
        .author-tag { background: linear-gradient(to right, #7e22ce, #db2777); border-radius: 4px; padding: 2px 6px; font-size: 8px; font-weight: 900; color: white; text-transform: uppercase; letter-spacing: 0.1em; }
        .user-rating-pill { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); padding: 1px 5px; border-radius: 99px; font-size: 8px; font-weight: 900; }
    </style>
</head>
<body class="bg-[#020617]">
    <div id="brightness-overlay"></div>
    <canvas id="particle-canvas"></canvas>
    <audio id="ambient-audio" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <!-- NAVIGATION -->
    <nav id="app-nav" class="fixed top-0 left-0 right-0 z-[100] hidden safe-top glass-panel">
        <div class="max-w-4xl mx-auto px-4 py-2 flex items-center justify-between h-14">
            <div id="nav-left" class="flex items-center gap-2 flex-1 min-w-0">
                <button id="master-back-btn" onclick="goBack()" class="p-1.5 hover:bg-white/5 rounded-full hidden flex-shrink-0">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div id="nav-profile-block" class="flex items-center gap-2 cursor-pointer overflow-hidden flex-1" onclick="toggleModal('settings-modal')">
                    <img id="nav-user-avatar" src="" class="w-9 h-9 rounded-full border border-white/10 object-cover flex-shrink-0">
                    <div class="flex flex-col min-w-0">
                        <div class="flex items-center gap-1">
                            <p id="nav-user-name" class="text-[11px] font-black text-white uppercase truncate tracking-tight">USER</p>
                            <span id="nav-rating-pill" class="user-rating-pill hidden">0 ★</span>
                        </div>
                        <span id="nav-user-role" class="text-[9px] font-bold text-purple-400 uppercase tracking-tighter">READER</span>
                    </div>
                </div>
                <div id="reader-nav-info" class="hidden flex-1 min-w-0 px-2">
                    <div class="h-1.5 bg-white/10 rounded-full w-full max-w-[140px] overflow-hidden">
                        <div id="reader-mini-progress" class="h-full bg-purple-500 w-0 transition-all duration-300"></div>
                    </div>
                </div>
            </div>

            <div id="nav-right" class="flex items-center gap-2">
                <button id="messages-btn" onclick="showView('readers-view')" class="p-2 text-slate-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </button>
                <button id="reader-like-btn" onclick="likeChapterAction()" class="p-3 text-red-500 hidden scale-125 transition-transform active:scale-100">♥</button>
                <button id="reader-comment-btn" onclick="openChapterComments()" class="p-3 text-slate-200 hidden transition-transform active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </button>
                <button onclick="toggleModal('app-settings-modal')" class="p-2 text-slate-400 rotating-gear">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- LOADING & LOGIN -->
    <section id="loading-view" class="view flex flex-col items-center justify-center bg-black">
        <div class="bold-italic text-4xl text-white opacity-60 animate-pulse">A FALSE HOPE</div>
        <p class="text-[9px] mt-2 opacity-30 tracking-[0.6em] uppercase">Starting Session</p>
    </section>

    <section id="login-view" class="view hidden flex flex-col items-center justify-center bg-black p-10">
        <div class="text-center space-y-10">
            <h1 class="bold-italic text-6xl text-white">A FALSE<br>HOPE</h1>
            <button id="google-login-btn" class="px-8 py-3.5 bg-purple-600 text-white font-bold text-xs tracking-widest rounded-lg transition-all active:scale-95 shadow-xl shadow-purple-900/30">LOG IN WITH GOOGLE</button>
        </div>
    </section>

    <!-- HOME -->
    <section id="home-view" class="view hidden bg-transparent pt-0 pb-32">
        <div class="hero-wrapper">
            <div class="hero-image-container"><img src="https://i.ibb.co/0jNjDF8k/Cover2.png" class="hero-image"><div class="hero-black-fade"></div></div>
            <div class="px-6 -mt-10 relative z-10">
                <div class="space-y-0.5">
                    <div class="flex flex-wrap gap-2 mb-2"><span class="genre-tag">Sci-fi</span><span class="genre-tag">Action</span><span class="genre-tag">Mystery</span><span class="genre-tag">Romance</span><span class="genre-tag">Horror</span></div>
                    <h2 class="bold-italic text-4xl lg:text-5xl animated-title mb-[-6px]">A FALSE HOPE</h2>
                    <p class="text-[12px] text-slate-400 leading-tight font-medium max-w-[280px]">Official reader portal. Survive the hope.</p>
                </div>
                
                <div class="flex items-center gap-3 mt-5">
                    <button onclick="showView('chapters-view')" class="btn-read-now h-11 flex-1 rounded-lg font-bold text-[12px] tracking-widest active:scale-95 text-white">READ NOW</button>
                    <button onclick="shareStory()" class="w-11 h-11 bg-white/5 border border-white/10 rounded-lg flex items-center justify-center">🔗</button>
                    <button onclick="toggleModal('rating-modal')" class="w-11 h-11 bg-white/5 border border-white/10 rounded-lg flex items-center justify-center text-yellow-500">★</button>
                </div>

                <!-- SPECIAL RECOGNITION ROW -->
                <div class="mt-8 flex items-center gap-3 overflow-x-auto py-2 scroll-container no-scrollbar whitespace-nowrap">
                    <h3 class="text-[9px] font-black text-white uppercase tracking-widest opacity-40 flex-shrink-0">Special Recognition:</h3>
                    <button onclick="openRecognition('MINASHA')" class="btn-minasha flex-shrink-0 px-5 py-2 rounded-full text-[10px] font-black text-white flex items-center gap-2 shadow-xl shadow-red-500/20 active:scale-95 transition-transform">
                        MINASHA ❤️
                    </button>
                    <button onclick="openRecognition('AROSHA')" class="btn-arosha flex-shrink-0 px-5 py-2 rounded-full text-[10px] font-black text-white flex items-center gap-2 shadow-xl shadow-orange-500/20 active:scale-95 transition-transform">
                        AROSHA 🔥
                    </button>
                </div>
                
                <div class="pt-6">
                    <div class="flex gap-6 border-b border-white/5 mb-4">
                        <button onclick="setHomeTab('leaderboard')" id="tab-leaderboard" class="tab-btn active pb-2 text-[10px] font-black uppercase tracking-widest">Top Readers</button>
                        <button onclick="setHomeTab('gallery')" id="tab-gallery" class="tab-btn pb-2 text-[10px] font-black uppercase tracking-widest">Gallery</button>
                    </div>
                    <div id="home-tab-content" class="min-h-[200px] space-y-4 pb-10"></div>
                </div>

                <div id="active-poll" class="p-6 glass-panel rounded-2xl border border-white/5 space-y-4 mt-6"></div>
            </div>
        </div>
    </section>

    <!-- READER -->
    <section id="reader-view" class="view hidden bg-black">
        <div id="reader-progress-bar" class="fixed top-0 left-0 h-1.5 bg-purple-600 w-0 z-[200]"></div>
        <div id="reader-pages" class="w-full max-w-3xl mx-auto relative pt-16"></div>
        <div class="p-20 text-center pb-40">
            <h3 class="bold-italic text-xl text-white opacity-40 uppercase">END OF CHAPTER</h3>
            <button onclick="goBack()" class="mt-8 px-10 py-4 border-2 border-purple-500/40 rounded-full font-black text-[11px] text-purple-400 uppercase tracking-widest">EXIT TO MENU</button>
        </div>
    </section>

    <!-- CHAPTERS -->
    <section id="chapters-view" class="view hidden bg-transparent pt-14">
        <div class="px-6 py-4 space-y-3 border-b border-white/5 sticky top-0 bg-[#020617] z-20">
            <div class="flex gap-4">
                <button onclick="setChapterSort('new')" id="sort-new" class="text-[9px] font-black uppercase text-purple-400">Latest First</button>
                <button onclick="setChapterSort('old')" id="sort-old" class="text-[9px] font-black uppercase text-slate-500">Oldest First</button>
            </div>
        </div>
        <div id="chapters-list-mobile" class="p-4 space-y-4 pb-32"></div>
    </section>

    <!-- READERS / MESSAGES VIEW -->
    <section id="readers-view" class="view hidden bg-transparent pt-14">
        <div id="readers-list" class="p-4 space-y-3 pb-32"></div>
    </section>

    <!-- MODALS -->
    <div id="app-settings-modal" class="fixed inset-0 z-[500] hidden modal-bg flex items-center justify-center p-6" onclick="if(event.target === this) toggleModal('app-settings-modal')">
        <div class="w-full max-w-[340px] glass-panel p-6 rounded-3xl space-y-6 border border-white/10 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center"><span class="text-[10px] font-black text-white uppercase tracking-widest">App Settings</span><button onclick="toggleModal('app-settings-modal')" class="text-slate-500">✕</button></div>
            <div class="space-y-4">
                <div class="flex justify-between items-center"><label class="text-[9px] font-bold text-slate-400 uppercase">Particles</label><label class="toggle-switch"><input type="checkbox" id="set-particles" checked onchange="appSettings.toggleParticles(this.checked)"><span class="slider"></span></label></div>
                <div class="flex justify-between items-center"><label class="text-[9px] font-bold text-slate-400 uppercase">Haptics</label><label class="toggle-switch"><input type="checkbox" id="set-haptic" checked onchange="appSettings.toggleHaptic(this.checked)"><span class="slider"></span></label></div>
                <div class="space-y-1"><label class="text-[9px] font-bold text-slate-400 uppercase">Music Volume</label><input type="range" min="0" max="1" step="0.1" value="0.5" oninput="appSettings.setVolume(this.value)" class="w-full accent-purple-600 bg-white/10 h-1 rounded-full appearance-none"></div>
                <div class="space-y-1"><label class="text-[9px] font-bold text-slate-400 uppercase">Brightness</label><input type="range" min="0" max="0.8" step="0.1" value="0" oninput="appSettings.setBrightness(this.value)" class="w-full accent-purple-600 bg-white/10 h-1 rounded-full appearance-none"></div>
                <button onclick="appSettings.clearCache()" class="w-full py-2 bg-red-500/10 text-red-500 border border-red-500/20 rounded-lg text-[8px] font-black uppercase">Clear Data</button>
            </div>
        </div>
    </div>

    <div id="user-detail-modal" class="fixed inset-0 z-[600] hidden modal-bg flex items-center justify-center p-6" onclick="if(event.target === this) toggleModal('user-detail-modal')">
        <div class="w-full max-w-[300px] glass-panel p-8 rounded-3xl text-center space-y-6 border border-white/10 relative">
            <button onclick="toggleModal('user-detail-modal')" class="absolute top-4 right-4 text-slate-600">✕</button>
            <div id="user-detail-content" class="space-y-4"></div>
        </div>
    </div>

    <div id="gallery-lightbox" class="fixed inset-0 z-[700] hidden modal-bg flex items-center justify-center p-4" onclick="toggleModal('gallery-lightbox')">
        <div class="relative w-full h-full flex flex-col items-center justify-center" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" class="max-w-full max-h-[70vh] rounded-lg shadow-2xl object-contain">
            <div id="fanart-interactions" class="w-full max-w-[400px] mt-4 p-4 glass-panel rounded-2xl border border-white/10 space-y-4 overflow-y-auto max-h-[25vh] no-scrollbar">
                <!-- Fan art likes/comments dynamically loaded here -->
            </div>
        </div>
    </div>

    <div id="chapter-comments-modal" class="fixed inset-0 z-[400] hidden modal-bg flex items-center justify-center p-6" onclick="if(event.target === this) toggleModal('chapter-comments-modal')">
        <div class="w-full max-w-[400px] h-[80vh] glass-panel p-6 rounded-3xl flex flex-col border border-white/10">
            <div class="flex justify-between items-center mb-4"><h3 class="text-[10px] font-black text-white uppercase tracking-widest">Comments</h3><button onclick="toggleModal('chapter-comments-modal')" class="text-slate-500">✕</button></div>
            <div id="chapter-comments-list" class="flex-1 overflow-y-auto space-y-4 mb-4 scroll-container"></div>
            <div class="flex gap-2"><input id="chapter-comment-input" type="text" placeholder="Add a comment..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-[11px] text-white outline-none"><button onclick="submitChapterComment()" class="bg-purple-600 px-4 rounded-xl text-[10px] font-black uppercase">Post</button></div>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 z-[200] hidden modal-bg flex items-center justify-center p-6" onclick="if(event.target === this) toggleModal('settings-modal')">
        <div class="w-full max-w-[320px] glass-panel p-6 rounded-2xl space-y-5 border border-white/10 overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center"><span class="text-[10px] font-black text-white uppercase">Profile</span><button onclick="toggleModal('settings-modal')" class="text-slate-500">✕</button></div>
            <div class="flex flex-col items-center gap-2">
                <div id="profile-avatar-wrapper" class="rounded-full p-1"><img id="settings-avatar" src="" class="w-16 h-16 rounded-full object-cover"></div>
                <div class="text-center">
                    <div class="flex items-center justify-center gap-1 mb-1">
                        <p id="settings-role-label" class="text-[8px] text-purple-400 font-black uppercase tracking-widest">READER</p>
                        <span id="settings-rating-pill" class="user-rating-pill">0 ★</span>
                    </div>
                    <p id="settings-user-name" class="text-xs font-black text-white uppercase truncate">NAME</p>
                </div>
            </div>
            <div class="space-y-3">
                <input id="profile-edit-name" type="text" class="bg-white/5 border border-white/10 rounded-lg p-2 w-full text-xs text-white" placeholder="Display Name">
                <textarea id="profile-edit-bio" rows="2" class="bg-white/5 border border-white/10 rounded-lg p-2 w-full text-xs text-white resize-none" placeholder="Short Bio"></textarea>
                <button onclick="updateProfile()" class="w-full bg-purple-600 py-2 rounded-lg font-bold text-[10px] uppercase text-white">SAVE PROFILE</button>
            </div>
            <button onclick="supabase.auth.signOut().then(() => location.reload())" class="w-full text-red-500/50 font-bold text-[8px] uppercase">LOG OUT</button>
        </div>
    </div>

    <!-- Recognition Modal -->
    <div id="recognition-modal" class="fixed inset-0 z-[250] hidden modal-bg flex items-center justify-center p-8" onclick="if(event.target === this) toggleModal('recognition-modal')">
        <div class="w-full max-w-[280px] glass-panel p-8 rounded-2xl text-center space-y-4 border border-purple-500/20">
            <div id="recognition-icon-box" class="text-3xl">❤️</div>
            <h3 id="recognition-name" class="font-bold text-sm text-white tracking-widest uppercase">NAME</h3>
            <p id="recognition-text" class="text-[10px] text-slate-400 leading-relaxed font-medium">Loading...</p>
            <button onclick="toggleModal('recognition-modal')" class="w-full py-2.5 bg-purple-600 rounded-lg text-[9px] font-bold text-white uppercase tracking-widest">CLOSE</button>
        </div>
    </div>
    
    <div id="rating-modal" class="fixed inset-0 z-[200] hidden modal-bg flex items-center justify-center p-6" onclick="if(event.target === this) toggleModal('rating-modal')">
        <div class="w-full max-w-[300px] glass-panel p-8 rounded-2xl text-center space-y-6 border border-white/10">
            <h3 class="font-bold text-xs text-white uppercase tracking-widest">Rate the Story</h3>
            <div id="star-container" class="flex justify-center py-2 text-2xl gap-2">
                <span onclick="setRating(1)" class="star cursor-pointer opacity-30 transition-all">★</span>
                <span onclick="setRating(2)" class="star cursor-pointer opacity-30 transition-all">★</span>
                <span onclick="setRating(3)" class="star cursor-pointer opacity-30 transition-all">★</span>
                <span onclick="setRating(4)" class="star cursor-pointer opacity-30 transition-all">★</span>
                <span onclick="setRating(5)" class="star cursor-pointer opacity-30 transition-all">★</span>
            </div>
            <button onclick="submitRating()" class="w-full py-3 bg-purple-600 rounded-lg font-bold text-[10px] uppercase tracking-widest">SUBMIT</button>
            <button onclick="toggleModal('rating-modal')" class="text-slate-600 text-[9px] font-bold uppercase">CANCEL</button>
        </div>
    </div>

    <script src="index.js" type="module"></script>
</body>
</html>
