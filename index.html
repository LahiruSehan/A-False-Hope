<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>A FALSE HOPE | Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --crimson: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: #020617; color: #f8fafc; overflow: hidden; }
        .fantasy-font { font-family: 'Cinzel', serif; }
        .view { height: 100vh; width: 100vw; position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; z-index: 10; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .view.hidden { opacity: 0; pointer-events: none; transform: translateY(20px); }
        .glass { background: rgba(7, 10, 25, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .modal-bg { background: rgba(0,0,0,0.9); backdrop-filter: blur(12px); z-index: 500; }
        
        .text-glow-crimson { text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        .btn-void { background: linear-gradient(135deg, #1e40af, #3b82f6); box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); transition: all 0.3s; }
        .btn-void:active { transform: scale(0.96); opacity: 0.8; }
        
        .online-ring { position: relative; }
        .online-ring::after { content: ''; position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: #22c55e; border: 2px solid #020617; border-radius: 50%; box-shadow: 0 0 10px #22c55e; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 10px; }
    </style>
</head>
<body>
    <canvas id="particle-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-30"></canvas>

    <!-- NAVIGATION BAR -->
    <nav id="app-nav" class="fixed top-0 left-0 right-0 z-[100] hidden glass h-16 flex items-center px-6 justify-between border-b">
        <div class="flex items-center gap-4">
            <button id="nav-back-btn" class="hidden p-2 hover:bg-white/5 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="flex items-center gap-3 cursor-pointer group" onclick="toggleModal('profile-modal')">
                <img id="nav-avatar" src="" class="w-10 h-10 rounded-full object-cover border-2 border-blue-500/30 group-hover:border-blue-500 transition-all">
                <div class="flex flex-col">
                    <span id="nav-username" class="text-[10px] font-black uppercase tracking-widest text-white">USER</span>
                    <span id="nav-status" class="text-[8px] text-blue-400 font-bold uppercase tracking-tighter">DISCIPLE</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="showView('social-view')" class="p-2 text-slate-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
            <button onclick="showView('chapters-view')" class="p-2 text-slate-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg></button>
        </div>
    </nav>

    <!-- LOADING VIEW -->
    <section id="loading-view" class="view flex flex-col items-center justify-center bg-black z-[1000]">
        <div class="relative">
            <h1 class="fantasy-font text-4xl font-black text-crimson-gradient animate-pulse tracking-[0.5em] text-glow-crimson">A FALSE HOPE</h1>
            <div class="absolute -bottom-8 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/10 rounded-full overflow-hidden">
                <div class="h-full bg-blue-600 animate-[loading_2s_infinite_ease-in-out]"></div>
            </div>
        </div>
    </section>

    <!-- LOGIN VIEW -->
    <section id="login-view" class="view hidden flex flex-col items-center justify-center p-10 text-center bg-[#020617]">
        <div class="mb-12">
            <h1 class="fantasy-font text-7xl font-black leading-none mb-2">A FALSE<br><span class="text-red-600">HOPE</span></h1>
            <p class="text-slate-500 uppercase tracking-[0.3em] text-[10px] font-bold">The Abyss Awaits Your Arrival</p>
        </div>
        <button id="google-login-btn" class="btn-void w-full max-w-sm py-5 rounded-2xl font-black text-xs tracking-widest uppercase flex items-center justify-center gap-3">
            <img src="https://www.svgrepo.com/show/355037/google.svg" class="w-5 h-5"> Sign In with the Void
        </button>
    </section>

    <!-- HOME VIEW -->
    <section id="home-view" class="view hidden pt-16 pb-32">
        <div class="relative w-full h-[45vh]">
            <img id="hero-img" src="" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-[#020617] via-[#020617]/40 to-transparent"></div>
        </div>
        <div class="px-8 -mt-20 relative z-10">
            <h2 class="fantasy-font text-5xl font-black text-white leading-tight">A FALSE<br>HOPE</h2>
            <p class="text-blue-400 text-[10px] font-black tracking-[0.2em] uppercase mt-2">v3.0 Official Reader</p>
            
            <div class="flex gap-4 mt-8">
                <button onclick="showView('chapters-view')" class="btn-void flex-1 py-5 rounded-2xl font-black text-xs uppercase tracking-widest">Open Scrolls</button>
                <button onclick="toggleModal('rating-modal')" class="bg-white/5 border border-white/10 w-16 rounded-2xl flex items-center justify-center text-yellow-500 hover:bg-white/10 transition-all">★</button>
            </div>

            <div class="mt-12 flex items-center gap-6 border-b border-white/5">
                <button onclick="setHomeTab('leaderboard')" id="tab-leaderboard" class="pb-4 text-[10px] font-black uppercase text-white border-b-2 border-blue-500 transition-all">Leaderboard</button>
                <button onclick="setHomeTab('news')" id="tab-news" class="pb-4 text-[10px] font-black uppercase text-slate-500 hover:text-white transition-all">Latest News</button>
            </div>
            <div id="home-content" class="mt-8 space-y-4"></div>
        </div>
    </section>

    <!-- SOCIAL VIEW (LIVE USERS) -->
    <section id="social-view" class="view hidden pt-24 px-6 pb-20">
        <div class="flex items-center justify-between mb-8">
            <h3 class="fantasy-font text-2xl font-black">LIVE FEED</h3>
            <span class="bg-green-500/20 text-green-500 text-[9px] font-black px-3 py-1 rounded-full animate-pulse uppercase">Active Now</span>
        </div>
        <div id="social-list" class="space-y-4"></div>
    </section>

    <!-- CHAPTERS VIEW -->
    <section id="chapters-view" class="view hidden pt-24 pb-20 px-6">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-1.5 h-10 bg-blue-600 rounded-full"></div>
            <h3 class="fantasy-font text-3xl font-black uppercase tracking-tight">Archives</h3>
        </div>
        <div id="chapters-list" class="grid grid-cols-1 gap-5"></div>
    </section>

    <!-- READER VIEW -->
    <section id="reader-view" class="view hidden bg-black">
        <div class="fixed top-0 left-0 right-0 h-1 z-[200]">
            <div id="reader-progress" class="h-full bg-blue-500 w-0 transition-all shadow-[0_0_10px_#3b82f6]"></div>
        </div>
        <div id="reader-pages" class="w-full max-w-4xl mx-auto flex flex-col gap-px"></div>
    </section>

    <!-- PROFILE MODAL -->
    <div id="profile-modal" class="fixed inset-0 hidden modal-bg flex items-center justify-center p-6" onclick="if(event.target===this) toggleModal('profile-modal')">
        <div class="w-full max-w-sm glass p-10 rounded-[2.5rem] text-center shadow-2xl animate-in zoom-in-95 duration-200" onclick="event.stopPropagation()">
            <div class="relative inline-block mb-6">
                <img id="edit-avatar-preview" src="" class="w-28 h-28 rounded-full object-cover border-4 border-blue-600/30">
                <button onclick="setNewAvatar()" class="absolute bottom-0 right-0 bg-blue-600 p-2 rounded-full border-4 border-[#020617]"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg></button>
            </div>
            <input id="edit-display-name" type="text" placeholder="Disciple Name" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-sm text-white text-center mb-4 focus:border-blue-500 outline-none transition-all">
            <textarea id="edit-bio" placeholder="Describe your essence..." class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-sm text-white text-center h-28 resize-none mb-8 focus:border-blue-500 outline-none transition-all"></textarea>
            <button onclick="saveProfile()" class="btn-void w-full py-4 rounded-xl font-black text-xs uppercase tracking-widest">Update Essence</button>
            <button onclick="supabase.auth.signOut().then(() => location.reload())" class="mt-8 text-slate-500 hover:text-red-500 text-[9px] font-black uppercase tracking-tighter opacity-50 transition-all">Sever Connection</button>
        </div>
    </div>

    <!-- CHAT MODAL -->
    <div id="chat-modal" class="fixed inset-0 hidden modal-bg flex flex-col pt-20" onclick="if(event.target===this) toggleModal('chat-modal')">
        <div class="flex-1 flex flex-col glass rounded-t-[3rem] mt-auto h-[90vh] overflow-hidden animate-in slide-in-from-bottom duration-300" onclick="event.stopPropagation()">
            <div class="p-6 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <img id="chat-target-avatar" src="" class="w-12 h-12 rounded-full object-cover border-2 border-white/10">
                    <div>
                        <h4 id="chat-target-name" class="font-black uppercase text-sm tracking-widest">NAME</h4>
                        <p class="text-[8px] text-green-500 font-bold uppercase">Online Now</p>
                    </div>
                </div>
                <button onclick="toggleModal('chat-modal')" class="p-3 text-2xl opacity-20 hover:opacity-100 transition-all">&times;</button>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 flex flex-col"></div>
            <div class="p-6 bg-black/40 border-t border-white/5 safe-bottom flex gap-3">
                <input id="chat-input" type="text" placeholder="Whisper into the void..." class="flex-1 bg-white/5 border border-white/10 rounded-full px-6 py-4 text-sm text-white focus:border-blue-500 outline-none">
                <button onclick="sendChatMessage()" class="bg-blue-600 w-14 h-14 rounded-full flex items-center justify-center shadow-lg"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg></button>
            </div>
        </div>
    </div>

    <script type="module" src="index.js"></script>
    <style>
        @keyframes loading { 0% { transform: translateX(-100%); } 50% { transform: translateX(0%); } 100% { transform: translateX(100%); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</body>
</html>
