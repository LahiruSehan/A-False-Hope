
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A FALSE HOPE | Reader</title>
    <!-- PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
    <style>
        :root { --aura-color: #a855f7; --void-black: #020617; }
        body { font-family: 'Inter', sans-serif; background: var(--void-black); color: #f8fafc; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        #particle-canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .view { height: 100vh; width: 100vw; overflow: hidden; position: fixed; inset: 0; z-index: 10; }
        .hidden { display: none !important; }
        .glass-panel { background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .bold-italic { font-weight: 900; font-style: italic; letter-spacing: -0.04em; }
        .animated-title {
            background: linear-gradient(to right, #a855f7, #ec4899, #3b82f6, #a855f7);
            background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: gradient-flow 4s linear infinite; display: inline-block; white-space: nowrap;
        }
        @keyframes gradient-flow { 0% { background-position: 0% center; } 100% { background-position: 100% center; } }
        .hero-wrapper { max-width: 800px; margin: 0 auto; position: relative; }
        .hero-image-container { position: relative; width: 100%; height: 35vh; overflow: hidden; border-bottom: 1px solid rgba(168, 85, 247, 0.1); }
        .hero-image { width: 100%; height: 100%; object-fit: cover; }
        .hero-black-fade { position: absolute; bottom: 0; left: 0; right: 0; height: 100%; background: linear-gradient(to top, var(--void-black) 0%, transparent 80%); }
        .genre-tag { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(4px); padding: 3px 8px; border-radius: 4px; font-size: 8px; font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.5); }
        .scroll-container::-webkit-scrollbar { width: 4px; }
        .scroll-container::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.3); border-radius: 10px; }
        .aura-effect { box-shadow: 0 0 15px var(--aura-color); }
        .settings-input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: white; width: 100%; outline: none; }
        .tab-btn { transition: 0.3s; color: rgba(255,255,255,0.3); }
        .tab-btn.active { border-bottom: 2px solid var(--aura-color); color: white; }
        .expandable-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .expanded .expandable-content { max-height: 400px; }
    </style>
</head>
<body class="bg-[#020617]">
    <canvas id="particle-canvas"></canvas>
    <audio id="ambient-audio" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <!-- NAVIGATION -->
    <nav id="app-nav" class="fixed top-0 left-0 right-0 z-[100] hidden safe-top glass-panel">
        <div class="max-w-4xl mx-auto px-4 py-2 flex items-center justify-between">
            <div class="flex items-center gap-2 flex-1 min-w-0 pr-4">
                <button id="master-back-btn" onclick="goBack()" class="p-1.5 hover:bg-white/5 rounded-full hidden flex-shrink-0">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div class="flex items-center gap-2 cursor-pointer overflow-hidden flex-1" onclick="toggleModal('settings-modal')">
                    <img id="nav-user-avatar" src="" class="w-8 h-8 rounded-full border border-white/10 object-cover flex-shrink-0">
                    <div class="flex flex-col min-w-0">
                        <p id="nav-user-name" class="text-[10px] font-black text-white uppercase truncate tracking-tight">USER</p>
                        <span id="nav-user-lvl" class="text-[8px] font-bold text-purple-400">LVL 1</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-1 flex-shrink-0">
                <button onclick="toggleModal('achievements-modal')" class="p-2 text-yellow-500">🏆</button>
                <button onclick="showView('readers-view')" class="p-2 text-slate-400 relative">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    <div id="new-msg-dot" class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-black hidden"></div>
                </button>
            </div>
        </div>
    </nav>

    <!-- VIEWS -->
    <section id="loading-view" class="view flex flex-col items-center justify-center bg-black">
        <div class="bold-italic text-4xl text-white opacity-60 animate-pulse">A FALSE HOPE</div>
        <p id="streak-msg" class="text-[9px] mt-2 opacity-30 tracking-[0.6em] uppercase">Synchronizing Souls</p>
    </section>

    <section id="login-view" class="view hidden flex flex-col items-center justify-center bg-black p-10">
        <div class="text-center space-y-10">
            <h1 class="bold-italic text-6xl text-white">A FALSE<br>HOPE</h1>
            <button id="google-login-btn" class="px-8 py-3.5 bg-purple-600 text-white font-bold text-xs tracking-widest rounded-lg transition-all active:scale-95 shadow-xl shadow-purple-900/30">LOG IN WITH GOOGLE</button>
        </div>
    </section>

    <!-- HOME -->
    <section id="home-view" class="view hidden bg-transparent overflow-y-auto pt-0 pb-32 scroll-container">
        <div class="hero-wrapper">
            <div class="hero-image-container"><img src="https://i.ibb.co/0jNjDF8k/Cover2.png" class="hero-image"><div class="hero-black-fade"></div></div>
            <div class="px-6 -mt-10 relative z-10 space-y-6">
                <div class="flex flex-wrap gap-2"><span class="genre-tag">Sci-fi</span><span class="genre-tag">Action</span><span class="genre-tag">Mystery</span><span class="genre-tag">Romance</span><span class="genre-tag">Horror</span></div>
                <h2 class="bold-italic text-4xl lg:text-5xl animated-title">A FALSE HOPE</h2>
                <p class="text-[12px] text-slate-400 leading-relaxed font-medium">The official portal to the Sanctum. Survive the hope.</p>
                <div class="flex items-center gap-3">
                    <button onclick="showView('chapters-view')" class="bg-purple-600 h-11 flex-1 rounded-lg font-bold text-[12px] tracking-widest active:scale-95">READ NOW</button>
                    <button onclick="shareStory()" class="btn-action w-11 h-11 bg-white/5 border border-white/10 rounded-lg flex items-center justify-center">🔗</button>
                    <button onclick="toggleModal('rating-modal')" class="btn-action w-11 h-11 bg-white/5 border border-white/10 rounded-lg flex items-center justify-center text-yellow-500">★</button>
                </div>
                
                <div class="pt-6">
                    <div class="flex gap-6 border-b border-white/5 mb-4">
                        <button onclick="setHomeTab('feed')" id="tab-feed" class="tab-btn active pb-2 text-[10px] font-black uppercase tracking-widest">Dev-Log</button>
                        <button onclick="setHomeTab('leaderboard')" id="tab-leaderboard" class="tab-btn pb-2 text-[10px] font-black uppercase tracking-widest">Souls</button>
                        <button onclick="setHomeTab('gallery')" id="tab-gallery" class="tab-btn pb-2 text-[10px] font-black uppercase tracking-widest">Gallery</button>
                    </div>
                    <div id="home-tab-content" class="min-h-[200px] space-y-4"></div>
                </div>

                <div id="active-poll" class="p-6 glass-panel rounded-2xl border border-white/5 space-y-4"></div>
            </div>
        </div>
    </section>

    <!-- MODALS -->
    <div id="settings-modal" class="fixed inset-0 z-[200] hidden bg-black/95 flex items-center justify-center p-6">
        <div class="w-full max-w-[320px] glass-panel p-6 rounded-2xl space-y-5 border border-white/10 scroll-container overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center"><span class="text-[10px] font-black text-white uppercase">Vessel Protocol</span><button onclick="toggleModal('settings-modal')" class="text-slate-500">✕</button></div>
            <div class="flex flex-col items-center gap-2">
                <div id="aura-container" class="rounded-full p-1"><img id="settings-avatar" src="" class="w-16 h-16 rounded-full object-cover"></div>
                <div class="text-center">
                    <p id="settings-title-label" class="text-[8px] text-purple-400 font-black uppercase tracking-widest mb-1">DRIFTER</p>
                    <p id="settings-user-name" class="text-xs font-black text-white uppercase truncate">NAME</p>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2 text-center py-2 border-y border-white/5">
                <div><p class="text-[7px] text-slate-500 uppercase font-black">Pages</p><p id="stat-pages" class="text-xs font-bold">0</p></div>
                <div><p class="text-[7px] text-slate-500 uppercase font-black">Streak</p><p id="stat-streak" class="text-xs font-bold">0d</p></div>
            </div>
            <div class="space-y-3">
                <input id="profile-edit-name" type="text" class="settings-input" placeholder="Name">
                <textarea id="profile-edit-bio" rows="2" class="settings-input resize-none" placeholder="Bio"></textarea>
                <div class="flex gap-2">
                    <input id="social-discord" type="text" class="settings-input" placeholder="Discord">
                    <input id="social-insta" type="text" class="settings-input" placeholder="Insta">
                </div>
                <button onclick="updateProfile()" class="w-full bg-purple-600 py-2 rounded-lg font-bold text-[10px] uppercase text-white">SAVE ECHO</button>
            </div>
            <button onclick="supabase.auth.signOut().then(() => location.reload())" class="w-full text-red-500/50 font-bold text-[8px] uppercase">TERMINATE SESSION</button>
        </div>
    </div>

    <div id="achievements-modal" class="fixed inset-0 z-[200] hidden bg-black/95 flex items-center justify-center p-6">
        <div class="w-full max-w-sm glass-panel p-6 rounded-2xl space-y-4 border border-yellow-500/20">
            <h3 class="font-black text-xs text-yellow-500 uppercase tracking-widest">Achieved Echoes</h3>
            <div id="achievements-list" class="space-y-3 max-h-[300px] overflow-y-auto scroll-container"></div>
            <button onclick="toggleModal('achievements-modal')" class="w-full py-2 bg-white/5 rounded-lg text-[9px] font-bold text-white/40">CLOSE</button>
        </div>
    </div>

    <!-- CHAPTERS -->
    <section id="chapters-view" class="view hidden bg-transparent pt-14 flex flex-col">
        <div class="px-6 py-4 space-y-3 border-b border-white/5">
            <input id="chapter-search" type="text" oninput="loadChapters()" placeholder="Search logs..." class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-[10px] text-white outline-none">
            <div class="flex gap-4">
                <button onclick="setChapterSort('new')" id="sort-new" class="text-[8px] font-black uppercase text-purple-400">Latest</button>
                <button onclick="setChapterSort('old')" id="sort-old" class="text-[8px] font-black uppercase text-slate-500">Oldest</button>
                <button onclick="setChapterSort('top')" id="sort-top" class="text-[8px] font-black uppercase text-slate-500">Popular</button>
            </div>
        </div>
        <div id="chapters-list-mobile" class="flex-1 overflow-y-auto p-4 space-y-4 pb-32 scroll-container"></div>
    </section>

    <!-- READERS -->
    <section id="readers-view" class="view hidden bg-transparent pt-14 flex flex-col">
        <div id="readers-list" class="flex-1 overflow-y-auto px-4 space-y-3 pt-4 pb-32 scroll-container"></div>
    </section>

    <!-- READER -->
    <section id="reader-view" class="view hidden bg-black flex flex-col overflow-y-auto scroll-container">
        <div id="reader-progress-bar" class="fixed top-0 left-0 h-1 bg-purple-600 w-0 z-[200]"></div>
        <div class="fixed top-4 right-4 z-[200] flex gap-2">
            <button onclick="toggleMusic()" id="music-btn" class="w-10 h-10 bg-black/50 backdrop-blur rounded-full flex items-center justify-center text-xs">🔇</button>
            <button onclick="toggleBookmark()" id="bookmark-btn" class="w-10 h-10 bg-black/50 backdrop-blur rounded-full flex items-center justify-center text-xs">🔖</button>
        </div>
        <div id="reader-pages" class="w-full max-w-3xl mx-auto relative"></div>
        <div class="p-20 text-center safe-bottom">
            <h3 class="bold-italic text-xl text-white opacity-40 uppercase">END OF RECORD</h3>
            <button onclick="goBack()" class="mt-8 px-8 py-3 border border-purple-500/30 rounded-full font-bold text-[10px] text-purple-400 uppercase">EXIT</button>
        </div>
    </section>

    <script src="index.js" type="module"></script>
</body>
</html>
