
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A FALSE HOPE | The Sanctum</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Cinzel:wght@900&family=Bebas+Neue&family=Nosifer&display=swap" rel="stylesheet">
    <style>
        :root { --aura-color: #a855f7; --aura-glow: rgba(168, 85, 247, 0.4); --void-black: #020617; }
        body { font-family: 'Inter', sans-serif; background: var(--void-black); color: #f8fafc; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .font-impact { font-family: 'Bebas Neue', cursive; }
        .font-horror { font-family: 'Nosifer', cursive; }
        .font-title { font-family: 'Cinzel', serif; }

        .view { height: 100vh; width: 100vw; overflow: hidden; position: fixed; inset: 0; }
        .hidden { display: none !important; }

        .aura-text { color: var(--aura-color); text-shadow: 0 0 15px var(--aura-glow); transition: 0.5s; }
        .aura-bg { background: var(--aura-color); box-shadow: 0 0 25px var(--aura-glow); transition: 0.5s; }
        .glass-panel { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }

        /* THE TITLE: EPIC FANTASY HORROR */
        .horror-title {
            font-size: 5rem; line-height: 0.8; letter-spacing: -4px;
            background: linear-gradient(to bottom, #f8fafc 30%, var(--aura-color) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
            transform: skewX(-5deg);
        }

        /* VOID PORTAL BUTTON */
        .btn-portal {
            position: relative; overflow: hidden; border-radius: 2rem;
            background: #000; border: 1px solid var(--aura-color);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-portal:active { transform: scale(0.9) rotate(-1deg); }
        .btn-portal::before {
            content: ''; position: absolute; inset: -50%;
            background: conic-gradient(from 180deg at 50% 50%, transparent, var(--aura-color), transparent);
            animation: rotate-portal 4s linear infinite; opacity: 0.3;
        }
        @keyframes rotate-portal { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* FLOATING BACK BUTTON */
        .back-orb {
            width: 50px; height: 50px; border-radius: 50%; background: var(--void-black);
            border: 2px solid var(--aura-color); display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--aura-glow); transition: 0.3s; z-index: 1000;
        }

        .xp-bar-fill { transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .safe-bottom { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
        .safe-top { padding-top: env(safe-area-inset-top); }

        .special-badge {
            width: 40px; height: 40px; border-radius: 12px; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
</head>
<body class="bg-black">

    <!-- FLOATING NAV TOOLS -->
    <button id="master-back-btn" onclick="goBack()" class="fixed bottom-10 left-8 back-orb hidden">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M15 19l-7-7 7-7"></path></svg>
    </button>

    <!-- NAV BAR -->
    <nav id="app-nav" class="fixed top-0 left-0 right-0 z-[80] hidden safe-top">
        <div class="px-6 py-3 flex items-center justify-between glass-panel border-b border-white/5">
            <div class="flex items-center gap-3" onclick="showView('profile-view')">
                <img id="nav-user-avatar" src="" class="w-9 h-9 rounded-full border border-white/10">
                <div>
                    <p id="nav-user-name" class="text-[9px] font-black tracking-widest text-white uppercase truncate max-w-[80px]">USER</p>
                    <div class="h-1 bg-white/5 rounded-full w-16 mt-1 overflow-hidden"><div class="xp-bar-fill h-full w-0"></div></div>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="showView('readers-view')" class="text-[10px] font-black aura-text tracking-widest">DWELLERS</button>
                <button onclick="toggleModal('settings-modal')" class="p-1">⚙️</button>
            </div>
        </div>
    </nav>

    <!-- LOADING -->
    <section id="loading-view" class="view flex flex-col items-center justify-center">
        <div class="horror-title text-2xl opacity-20">SANCTUM</div>
        <div class="mt-4 w-48 h-0.5 bg-white/5 overflow-hidden"><div class="h-full aura-bg animate-pulse"></div></div>
    </section>

    <!-- LOGIN -->
    <section id="login-view" class="view hidden flex flex-col items-center justify-center bg-black p-10">
        <img src="https://i.ibb.co/0jNjDF8k/Cover2.png" class="absolute inset-0 w-full h-full object-cover opacity-30">
        <div class="relative z-10 text-center space-y-16">
            <div class="horror-title">A FALSE<br>HOPE</div>
            <button id="google-login-btn" class="px-12 py-5 bg-white text-black font-black text-xs rounded-full">ENTERING THE VOID</button>
        </div>
    </section>

    <!-- HOME (FULL SCREEN COMPOSITION) -->
    <section id="home-view" class="view hidden flex flex-col">
        <div class="absolute inset-0"><img src="https://i.ibb.co/0jNjDF8k/Cover2.png" class="w-full h-full object-cover opacity-60"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
        
        <div class="relative z-10 flex-1 flex flex-col justify-between px-8 pt-24 pb-12">
            <div class="space-y-2">
                <div class="flex items-center gap-3">
                    <span class="text-[8px] font-black border border-white/20 px-2 py-0.5 rounded">ORIGINAL ARCHIVE</span>
                    <span class="text-[8px] font-black aura-text level-label">LVL 1</span>
                </div>
                <div class="horror-title mt-4">A FALSE<br>HOPE</div>
                <p class="text-[11px] text-slate-400 font-medium leading-relaxed max-w-[280px]">Descend into the official chronicle of the void. Reclaim the light or vanish in the echoes.</p>
            </div>

            <div class="flex flex-col gap-6">
                <button onclick="showView('chapters-view')" class="btn-portal w-full h-24 flex items-center justify-center font-impact text-5xl text-white tracking-widest italic">
                    DESCEND NOW
                </button>
                
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-[8px] font-black text-slate-500 uppercase tracking-widest">Void Rank</p>
                        <p class="text-sm font-black aura-text rank-label">DRIFTER</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openRecognition('MINASHA')" class="special-badge border-pink-500/20 text-pink-500">❤️</button>
                        <button onclick="openRecognition('AROSHA')" class="special-badge border-orange-500/20 text-orange-500">🔥</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- CHAPTERS -->
    <section id="chapters-view" class="view hidden bg-black pt-20 flex flex-col">
        <div id="chapters-list-mobile" class="flex-1 overflow-y-auto p-8 space-y-4"></div>
    </section>

    <!-- DWELLERS (READERS LIST) -->
    <section id="readers-view" class="view hidden bg-black pt-20 flex flex-col">
        <div class="px-8 mb-6"><h2 class="font-impact text-4xl text-white tracking-widest">DWELLERS</h2></div>
        <div id="readers-list" class="flex-1 overflow-y-auto px-8 space-y-3 pb-32"></div>
    </section>

    <!-- CHAT VIEW -->
    <section id="chat-view" class="view hidden bg-black pt-20 flex flex-col">
        <div class="px-8 py-4 border-b border-white/5 flex items-center gap-3">
            <div id="chat-with-name" class="font-impact text-xl text-white">WHISPERING...</div>
        </div>
        <div id="chat-bubbles" class="flex-1 overflow-y-auto p-8 space-y-4 flex flex-col"></div>
        <div class="p-6 safe-bottom glass-panel">
            <div class="flex gap-3">
                <input id="chat-input" type="text" placeholder="Whisper into the void..." class="flex-1 bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-xs text-white">
                <button onclick="sendMessage()" class="aura-bg px-6 rounded-xl font-black text-xs text-white">SEND</button>
            </div>
        </div>
    </section>

    <!-- READER -->
    <section id="reader-view" class="view hidden bg-black flex flex-col overflow-y-auto">
        <div id="reader-progress-bar" class="fixed top-0 left-0 h-1 aura-bg w-0 z-[100]"></div>
        <div id="reader-pages" class="w-full"></div>
        <div class="p-20 text-center safe-bottom">
            <div class="horror-title text-3xl">ASCENDED</div>
            <button onclick="goBack()" class="mt-10 px-12 py-4 border border-white/10 rounded-full font-black text-[10px] text-white">RE-EMERGE</button>
        </div>
    </section>

    <!-- SETTINGS -->
    <div id="settings-modal" class="fixed inset-0 z-[100] hidden bg-black/90 backdrop-blur-xl flex items-center justify-center p-8">
        <div class="w-full max-w-sm glass-panel p-10 rounded-[3rem] space-y-10 relative">
            <button onclick="toggleModal('settings-modal')" class="absolute top-6 right-8 text-white/30 text-2xl font-black">✕</button>
            <h3 class="font-impact text-3xl text-white tracking-widest">SANCTUM CONFIG</h3>
            <div class="space-y-6">
                <div>
                    <p class="text-[9px] font-black text-slate-500 uppercase mb-3">Soul Resonance</p>
                    <div class="flex justify-between">
                        <div onclick="addXP(1)" class="w-8 h-8 rounded-full bg-purple-500 border-2 border-white/10"></div>
                        <div onclick="addXP(1)" class="w-8 h-8 rounded-full bg-blue-500 border-2 border-white/10"></div>
                        <div onclick="addXP(1)" class="w-8 h-8 rounded-full bg-red-500 border-2 border-white/10"></div>
                        <div onclick="addXP(1)" class="w-8 h-8 rounded-full bg-orange-500 border-2 border-white/10"></div>
                    </div>
                </div>
                <button onclick="supabase.auth.signOut().then(() => location.reload())" class="w-full py-4 bg-red-500/10 text-red-500 rounded-xl font-black text-[10px]">SEVER CONNECTION</button>
            </div>
        </div>
    </div>

    <!-- RECOGNITION -->
    <div id="recognition-modal" class="fixed inset-0 z-[100] hidden bg-black/95 flex items-center justify-center p-8">
        <div class="w-full max-w-xs glass-panel p-12 rounded-[3rem] text-center space-y-8 relative">
            <button onclick="toggleModal('recognition-modal')" class="absolute top-6 right-8 text-white/30 text-2xl">✕</button>
            <div id="recognition-icon-box" class="text-6xl animate-bounce"></div>
            <h3 id="recognition-name" class="horror-title text-3xl">NAME</h3>
            <p id="recognition-text" class="text-[10px] text-slate-400 font-bold leading-relaxed"></p>
            <button onclick="toggleModal('recognition-modal')" class="w-full py-4 aura-bg rounded-xl text-[10px] font-black text-white">HONORED</button>
        </div>
    </div>

    <script src="index.js" type="module"></script>
</body>
</html>
